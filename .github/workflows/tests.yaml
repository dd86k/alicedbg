name: Tests

on: [ push, pull_request ]

# Tests ensures the project builds and executes unittest.
# The entry points are rather minimal.
jobs:
  Alicedbg:
    strategy:
      matrix:
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#standard-github-hosted-runners-for-public-repositories
        include: # easier to maintain, more explicit
          # DMD: Currently x86-only
          # GDC: Works best on Linux, BSDs
          # NOTE: setup-dlang grabs gdc from repo, dmd/ldc always latest
          # Windows
          - { os: windows-2022, dc: dmd }
          - { os: windows-2022, dc: ldc }
          - { os: windows-2025, dc: dmd }
          - { os: windows-2025, dc: ldc }
          - { os: windows-11-arm, dc: ldc }
          # macOS
          #- { os: macos-14, dc: ldc }
          #- { os: macos-15, dc: ldc }
          #- { os: macos-26, dc: ldc }
          #- { os: macos-15-intel, dc: ldc }
          #- { os: macos-26-intel, dc: ldc }
          # Linux
          - { os: ubuntu-22.04, dc: gdc }
          - { os: ubuntu-24.04, dc: dmd }
          - { os: ubuntu-24.04, dc: gdc }
          - { os: ubuntu-24.04, dc: ldc }
          - { os: ubuntu-24.04-arm, dc: ldc }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Setup D compiler
      uses: dlang-community/setup-dlang@5d239e99bc553874d9362e7e6aeeac9454b6789f # v2
      with:
        compiler: ${{ matrix.dc }}
    - name: Test Alicedbg
      run: dub test :debugger
  Alicedump:
    strategy:
      matrix:
        os: [ ubuntu-22.04, windows-2022 ]
        dc: [ dmd-latest, ldc-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Setup D compiler
      uses: dlang-community/setup-dlang@5d239e99bc553874d9362e7e6aeeac9454b6789f # v2
      with:
        compiler: ${{ matrix.dc }}
    - name: Test Alicedump
      run: dub test :dumper  Layers:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Setup D compiler
      uses: dlang-community/setup-dlang@5d239e99bc553874d9362e7e6aeeac9454b6789f # v2
      with:
        compiler: dmd-latest
    - name: Test core and objects
      run: dub test :core && dub test :objects
    # Import paths limited to each layer, so a wrong-way import fails here
    - name: Build objects alone with betterC
      run: dmd -betterC -o- -Icore -Iobjects $(find core objects -name '*.d')
    - name: Import objects package alone
      run: echo 'import adbg.objects;' > t.d && dmd -betterC -o- -Icore -Iobjects t.d
